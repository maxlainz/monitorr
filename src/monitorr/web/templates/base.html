    <title>{% block title %}monitorr{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>

  <body>

      <nav>
        <ul>
