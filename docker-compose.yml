services:
  monitorr:
    image: ghcr.io/maxlainz/monitorr:latest
    # Alternatives:
    #   image: maxlainz/monitorr:latest   # Docker Hub
    #   build: .                          # build the image locally
    container_name: monitorr
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      - TZ=Europe/Madrid
      # - MONITORR_LOG_LEVEL=INFO
      # - MONITORR_PLEX_POLL_INTERVAL=30
      # - MONITORR_WEBHOOK_SECRET=change-me
    restart: unless-stopped
