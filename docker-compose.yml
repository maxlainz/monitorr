services:
  monitorr:
    image: maxlainz/monitorr:latest
    # Alternatives:
    #   image: ghcr.io/maxlainz/monitorr:latest   # GHCR
    #   build: .                                   # build the image locally
    container_name: monitorr
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      - TZ=Europe/Madrid
      # Match the host user that should own ./config (run `id -u` / `id -g`). Defaults to 1000:1000.
      # - PUID=1000
      # - PGID=1000
      # - MONITORR_LOG_LEVEL=INFO
      # - MONITORR_PLEX_POLL_INTERVAL=30
      # - MONITORR_WEBHOOK_SECRET=change-me
    restart: unless-stopped
